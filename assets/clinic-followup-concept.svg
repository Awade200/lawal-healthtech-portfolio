<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Follow-up and referral concept</title><desc id="desc">Illustrative concept for patient follow-up, care continuity and referral tracking.</desc><rect width="1600" height="900" fill="#f8f6f0"/><rect width="250" height="900" fill="#fbfaf7"/><text x="40" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#126b4b">Sulawog</text><text x="40" y="92" font-family="Arial,sans-serif" font-size="16" fill="#126b4b">Clinic</text><g font-family="Arial,sans-serif" font-size="17" fill="#35423c"><text x="40" y="160">Today</text><text x="40" y="215">Reception</text><text x="40" y="270">Patients</text><text x="40" y="325">Patient analysis</text><text x="40" y="380">Staff</text><text x="40" y="435">Billing</text><text x="40" y="490">Expenses</text><text x="40" y="545">Reports</text></g><g transform="translate(285 55)" font-family="Arial,sans-serif"><text x="0" y="35" font-size="15" letter-spacing="3" font-weight="700" fill="#0f513d">CONCEPT · NEXT ITERATION</text><text x="0" y="96" font-family="Georgia,serif" font-size="46" fill="#17251f">Follow-up &amp; care continuity</text><text x="0" y="130" font-size="18" fill="#67716c">Keep the next action visible after the patient leaves the clinic.</text></g><g transform="translate(285 225)" font-family="Arial,sans-serif"><rect width="410" height="560" rx="24" fill="#fff" stroke="#ddd9cd"/><text x="28" y="48" font-size="25" font-weight="700" fill="#17251f">Patients due for follow-up</text><text x="28" y="76" font-size="15" fill="#69726d">Illustrative queue</text><g transform="translate(28 110)"><rect width="354" height="98" rx="16" fill="#f3f6f4"/><circle cx="42" cy="49" r="25" fill="#dceae3"/><text x="42" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#0f513d">AM</text><text x="82" y="35" font-size="18" font-weight="700" fill="#24332d">A. Mensah</text><text x="82" y="61" font-size="14" fill="#68726d">Therapy review · due today</text><text x="82" y="82" font-size="14" fill="#0f513d">Call patient →</text></g><g transform="translate(28 222)"><rect width="354" height="98" rx="16" fill="#f3f6f4"/><circle cx="42" cy="49" r="25" fill="#f7ead3"/><text x="42" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#745225">KO</text><text x="82" y="35" font-size="18" font-weight="700" fill="#24332d">K. Okafor</text><text x="82" y="61" font-size="14" fill="#68726d">Consultation follow-up · overdue</text><text x="82" y="82" font-size="14" fill="#0f513d">Review notes →</text></g><g transform="translate(28 334)"><rect width="354" height="98" rx="16" fill="#f3f6f4"/><circle cx="42" cy="49" r="25" fill="#dce6f5"/><text x="42" y="56" text-anchor="middle" font-size="17" font-weight="700" fill="#315c98">FA</text><text x="82" y="35" font-size="18" font-weight="700" fill="#24332d">F. Adeyemi</text><text x="82" y="61" font-size="14" fill="#68726d">Check-in after prescription</text><text x="82" y="82" font-size="14" fill="#0f513d">Send reminder →</text></g></g><g transform="translate(725 225)" font-family="Arial,sans-serif"><rect width="400" height="265" rx="24" fill="#0f513d"/><text x="28" y="50" font-size="15" letter-spacing="2" font-weight="700" fill="#e1ba59">REFERRAL TRACKING</text><text x="28" y="95" font-family="Georgia,serif" font-size="32" fill="#fff">Make recommendations traceable.</text><text x="28" y="135" font-size="16" fill="#d6e5df">Attach the referrer to the new patient record, then keep any agreed clinic benefit visible.</text><g transform="translate(28 173)"><rect width="344" height="62" rx="15" fill="#2d6c58"/><text x="20" y="28" font-size="14" fill="#bfe8cf">Referral status</text><text x="20" y="48" font-size="18" font-weight="700" fill="#fff">Verified · reward pending</text></g></g><g transform="translate(725 520)" font-family="Arial,sans-serif"><rect width="400" height="265" rx="24" fill="#fff" stroke="#ddd9cd"/><text x="28" y="50" font-size="15" letter-spacing="2" font-weight="700" fill="#0f513d">CARE CONTINUITY</text><text x="28" y="95" font-size="28" font-weight="700" fill="#17251f">What happens next?</text><g font-size="16" fill="#33423b"><text x="28" y="135">✓ Review completed treatment</text><text x="28" y="170">○ Contact patient in 7 days</text><text x="28" y="205">○ Capture feedback or complaint</text><text x="28" y="240">○ Book further consultation if needed</text></g></g><g transform="translate(1155 225)" font-family="Arial,sans-serif"><rect width="390" height="560" rx="24" fill="#fff" stroke="#ddd9cd"/><text x="28" y="50" font-size="25" font-weight="700" fill="#17251f">Follow-up record</text><text x="28" y="80" font-size="15" fill="#69726d">Fictional demo entry</text><g font-size="14" fill="#69726d"><text x="28" y="130">Patient</text><text x="28" y="200">Reason</text><text x="28" y="270">Owner</text><text x="28" y="340">Next action</text><text x="28" y="410">Outcome</text></g><g font-size="18" font-weight="700" fill="#24332d"><text x="28" y="157">A. Mensah</text><text x="28" y="227">Therapy review</text><text x="28" y="297">Clinic team</text><text x="28" y="367">Phone check-in</text><text x="28" y="437">Pending</text></g><rect x="28" y="478" width="334" height="56" rx="16" fill="#0f513d"/><text x="195" y="513" text-anchor="middle" font-size="16" fill="#fff">Record follow-up</text></g><rect x="1370" y="18" width="175" height="38" rx="19" fill="#fff0d6"/><text x="1457" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#79531d">CONCEPT ONLY</text></svg>